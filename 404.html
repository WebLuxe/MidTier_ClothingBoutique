    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;
            background: radial-gradient(circle at 50% 40%, #5A0E1A 0%, #2D040D 65%); color: #FAF6EE;
            font-family: 'Montserrat', sans-serif; -webkit-font-smoothing: antialiased; padding: 24px;
        }
        .dots { position: absolute; inset: 0; pointer-events: none;
            background-image: radial-gradient(circle, rgba(230, 202, 101, .55) 0 1.3px, transparent 1.9px); background-size: 26px 26px;
            -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 45%, #000 30%, rgba(0,0,0,.4) 100%);
                    mask-image: radial-gradient(ellipse 80% 70% at 50% 45%, #000 30%, rgba(0,0,0,.4) 100%); }
        .dots::after { content: ''; position: absolute; inset: 0;
            background-image: radial-gradient(circle, rgba(255, 244, 205, .95) 0 1.7px, rgba(230, 202, 101, .35) 2.4px, transparent 4px);
            background-size: 78px 78px; background-position: 13px 13px; animation: twinkle 3.6s ease-in-out infinite alternate; }
        @keyframes twinkle { from { opacity: .15; } to { opacity: .85; } }
        .dust { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
        .dust b { position: absolute; bottom: -10px; width: var(--s); height: var(--s); border-radius: 50%; background: #F3DD8A; box-shadow: 0 0 8px 1px rgba(230, 202, 101, .8); opacity: 0; animation: rise var(--t) linear var(--d) infinite; }
        @keyframes rise { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translate(var(--x), -105vh); opacity: 0; } }

        .wrap { position: relative; z-index: 2; text-align: center; max-width: 560px; }
        .code { position: relative; display: flex; align-items: center; justify-content: center; gap: 4px;
            font-family: 'Playfair Display', serif; font-weight: 700; font-size: clamp(96px, 22vw, 168px); line-height: 1;
            background: linear-gradient(135deg, #FAF6EE 0%, #E6CA65 45%, #C5A059 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .code .o { position: relative; width: .78em; height: .78em; display: inline-block; }
        .code svg { width: 100%; height: 100%; overflow: visible; }
        .code svg .spin { transform-origin: 100px 100px; animation: spin 30s linear infinite; }
        .code svg .draw { fill: none; stroke: #E6CA65; stroke-width: 1.1; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.6s cubic-bezier(.6,.1,.2,1) forwards; animation-delay: var(--d, 0s); }
        .code svg .draw.thin { stroke-width: .6; stroke: #C5A059; }
        .code svg .dot { fill: #E6CA65; opacity: 0; animation: fade .6s ease 1.1s forwards; }
        @keyframes draw { to { stroke-dashoffset: 0; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fade { to { opacity: 1; } }

        .kicker { margin-top: 18px; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 13px; letter-spacing: .45em; text-transform: uppercase; color: #D4AF37; }
        h1 { margin-top: 10px; font-family: 'Playfair Display', serif; font-size: clamp(26px, 5vw, 38px); font-weight: 600; }
        p { margin-top: 12px; font-family: 'Cormorant Garamond', serif; font-size: 20px; line-height: 1.45; color: rgba(243, 236, 224, .85); }
        .divider { width: 96px; height: 2px; background: #D4AF37; margin: 22px auto 0; position: relative; }
        .divider::after { content: ''; position: absolute; left: 50%; top: -5px; width: 12px; height: 12px; background: #D4AF37; transform: translateX(-50%) rotate(45deg); }
        .actions { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
        .btn { display: inline-flex; align-items: center; gap: 10px; padding: 15px 26px; border-radius: 2px; font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; text-decoration: none; transition: all .3s ease; }
        .btn.gold { color: #2D040D; background: linear-gradient(110deg, #C5A059 0%, #D4AF37 25%, #FFF8DC 50%, #D4AF37 75%, #C5A059 100%); background-size: 200% 100%; animation: glint 6s linear infinite; box-shadow: 0 0 25px rgba(212,175,55,.25); }
        .btn.gold:hover { box-shadow: 0 0 35px rgba(212,175,55,.5); }
        .btn.line { color: #D4AF37; border: 1px solid rgba(212,175,55,.6); }
        .btn.line:hover { background: #4A0817; border-color: #D4AF37; }
        @keyframes glint { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .links { margin-top: 26px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; display: flex; flex-wrap: wrap; gap: 8px 22px; justify-content: center; }
        .links a { color: rgba(243, 236, 224, .75); text-decoration: none; transition: color .3s; }
        .links a:hover { color: #D4AF37; }
        .brand { position: absolute; top: 28px; left: 0; right: 0; text-align: center; z-index: 2; text-decoration: none; }
        .brand b { display: block; font-family: 'Playfair Display', serif; font-size: 22px; letter-spacing: .22em; background: linear-gradient(135deg, #FAF6EE, #D4AF37 50%, #C5A059); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .brand span { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 11px; letter-spacing: .45em; color: #D4AF37; }
        .in { opacity: 0; transform: translateY(18px); animation: up .9s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: var(--d, 0s); }
        @keyframes up { to { opacity: 1; transform: none; } }
        :focus-visible { outline: 2px solid #D4AF37; outline-offset: 3px; }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
    </style>
</head>
<body>
    <div class="dots"></div>
    <div class="dust" id="dust" aria-hidden="true"></div>

    <a class="brand home-link" href="/"><b>WEBLUXE</b><span>HIGH FASHION • BOUTIQUE</span></a>

    <main class="wrap">
        <div class="code in" aria-label="404" style="--d:.05s">
            <span aria-hidden="true">4</span>
            <span class="o" aria-hidden="true"><svg id="m" viewBox="0 0 200 200"></svg></span>
            <span aria-hidden="true">4</span>
        </div>
        <div class="kicker in" style="--d:.35s">Page not found</div>
        <h1 class="in" style="--d:.45s">This piece isn't on our rails</h1>
        <p class="in" style="--d:.55s">The page you're looking for may have moved or no longer exists. Our latest bridal and party wear is just a click away.</p>
        <div class="divider in" style="--d:.65s"></div>
        <div class="actions in" style="--d:.75s">
            <a class="btn gold home-link" href="/">Back to Home <i class="fa-solid fa-arrow-right-long"></i></a>
            <a class="btn line" href="https://wa.me/?text=Hello!" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> WhatsApp Us</a>
        </div>
        <nav class="links in" style="--d:.9s" aria-label="Popular pages">
            <a class="home-link" data-hash="#collections" href="/">The Collection</a>
            <a class="home-link" data-hash="#bride-groom" href="/">Bride &amp; Groom</a>
            <a class="home-link" data-hash="#visit" href="/">Visit Our Boutiques</a>
        </nav>
    </main>

    <script>
        /* GitHub Pages project sites live under /<repo>/, a custom domain lives at /. Point every link at the right home. */
        (function () {
            var base = /\.github\.io$/.test(location.hostname) ? '/' + location.pathname.split('/')[1] + '/' : '/';
            document.querySelectorAll('.home-link').forEach(function (a) { a.href = base + (a.dataset.hash || ''); });

            var ns = 'http://www.w3.org/2000/svg', svg = document.getElementById('m');
            function el(tag, attrs, parent) { var e = document.createElementNS(ns, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }
            var spin = el('g', { 'class': 'spin' }, svg);
            el('circle', { 'class': 'draw', pathLength: 1, cx: 100, cy: 100, r: 92, style: '--d:.1s' }, spin);
            el('circle', { 'class': 'draw thin', pathLength: 1, cx: 100, cy: 100, r: 82, style: '--d:.2s' }, spin);
            for (var i = 0; i < 12; i++) {
                el('path', { 'class': 'draw', pathLength: 1, d: 'M100 20 C 112 36, 112 52, 100 64 C 88 52, 88 36, 100 20 Z', transform: 'rotate(' + (i * 30) + ' 100 100)', style: '--d:' + (0.3 + i * 0.05) + 's' }, spin);
                el('circle', { 'class': 'dot', cx: 100, cy: 4, r: 2.6, transform: 'rotate(' + (i * 30 + 15) + ' 100 100)' }, spin);
            }
            el('circle', { 'class': 'draw', pathLength: 1, cx: 100, cy: 100, r: 30, style: '--d:.7s' }, spin);
            el('circle', { 'class': 'dot', cx: 100, cy: 100, r: 6 }, spin);

            var dust = document.getElementById('dust');
            for (var n = 0; n < 24; n++) {
                var b = document.createElement('b');
                b.style.left = (Math.random() * 100) + '%';
                b.style.setProperty('--s', (1.5 + Math.random() * 3) + 'px');
                b.style.setProperty('--t', (8 + Math.random() * 8) + 's');
                b.style.setProperty('--d', (Math.random() * 8) + 's');
                b.style.setProperty('--x', ((Math.random() - 0.5) * 160) + 'px');
                dust.appendChild(b);
            }
        })();
    </script>
</body>
